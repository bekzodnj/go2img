# Deployed via Dokploy: the image is built and pushed from a dev machine, so this
# file pulls a tag rather than building. Override APP_TAG per deploy to pin a commit.
services:
  postgres_db:
    image: postgres:15
    hostname: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default: a hardcoded password must not ship in the repo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # Published on the host's loopback only, for admin access over an SSH tunnel
    # (ssh -N -L 5433:127.0.0.1:5432 root@<server>); the app uses prisma-network.
    # Keep the 127.0.0.1 prefix: without it Docker binds 0.0.0.0, bypassing ufw,
    # and exposes the database to the internet.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prisma-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 2s
      retries: 20

  server:
    image: bekzodjon/go2img:${APP_TAG:-latest}
    restart: always
    # Dokploy's proxy routes to container port 3000 over dokploy-network, so the
    # host port is not published; publishing it would bypass the proxy and TLS.
    expose:
      - '3000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - R2_STORAGE_BASE_URL=${R2_STORAGE_BASE_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_DEV_URL=${R2_DEV_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN}
      - POLAR_SANDBOX_ACCESS_TOKEN=${POLAR_SANDBOX_ACCESS_TOKEN}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - prisma-network
      - dokploy-network

networks:
  prisma-network:
    external: true
  dokploy-network:
    external: true

volumes:
  postgres_data:
